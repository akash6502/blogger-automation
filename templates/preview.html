<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            color: #333;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            background-color: #f1f3f5;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: background-color 0.2s ease;
        }

        .back-btn:hover {
            background-color: #e2e6ea;
            color: #000;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<a href="/admin" class="back-btn">← Back to Admin</a>

<h1>{{ title }}</h1>

<div>
    {{ content | safe }}
</div>

<hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

{% for img in images %}
    <img src="{{ img[0] }}" alt="{{ img[1] }}">
{% endfor %}

</body>
</html>
